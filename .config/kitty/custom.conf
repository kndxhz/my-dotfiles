# Open links with Ctrl+left click, including in mouse-aware terminal apps.
mouse_map ctrl+left press grabbed discard_event
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link

# Font installed from ~/JetBrainsMapleMono-NF-XX-XX-XX.zip
font_family JetBrains Maple Mono
bold_font auto
italic_font auto

# Copy terminal selections, or pass Ctrl+Shift+C to apps such as Neovim.
map ctrl+shift+c copy_or_noop
bold_italic_font auto
