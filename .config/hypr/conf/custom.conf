# Add your additional Hyprland configurations here

# -----------------------------------------------------
# Fcitx5 Input Method (Rime)
# -----------------------------------------------------
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
#env = GTK_IM_MODULE,

# -----------------------------------------------------
# Waybar: real blur is handled by Hyprland (layer rules)
# -----------------------------------------------------
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.01, match:namespace waybar  # Blur even when the bar is very transparent
# NOTE: `ignorezero` was removed/renamed in newer Hyprland versions; keeping it would error.

# -----------------------------------------------------
# Keyring (Gnome Keyring)
# -----------------------------------------------------
exec-once = gnome-keyring-daemon --start --components=secrets
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/keyring/ssh

# -----------------------------------------------------
# Touchpad gestures
# -----------------------------------------------------
# Global 3-finger left/right workspace swipe (Hyprland native gesture)
gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, exec, /home/kndxhz/.config/hypr/scripts/swipe-screenshot.sh copy active
gesture = 3, down, dispatcher, exec, /home/kndxhz/.config/hypr/scripts/swipe-screenshot.sh copy screen
gesture = 4, up, dispatcher, exec, /home/kndxhz/.config/hypr/scripts/swipe-screenshot.sh save active
gesture = 4, down, dispatcher, exec, /home/kndxhz/.config/hypr/scripts/swipe-screenshot.sh save screen

# Tune workspace swipe sensitivity and direction
gestures {
    workspace_swipe_invert = true
    workspace_swipe_distance = 140
    workspace_swipe_cancel_ratio = 0.15
    workspace_swipe_min_speed_to_force = 8
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 8
}

# Explicitly allow and load hyprgrass plugin (disabled due to crashes)
# permission = /home/kndxhz/.config/hypr/plugins/hyprgrass.so, plugin, allow
# plugin = /home/kndxhz/.config/hypr/plugins/hyprgrass.so

# hyprgrass gestures are for touchscreens; this machine has no touch device.

# -----------------------------------------------------
# ThinkPad Fn key fixes
# -----------------------------------------------------
bindle = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindle = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
# Leave plain F1-F12 to applications; handle media actions via XF86 keys.
bind = , XF86TouchpadToggle, exec, ~/.config/hypr/scripts/toggle-trackpoint.sh
