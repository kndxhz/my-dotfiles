# Trial for Realtek ALC257 (10ec:0257), ThinkPad subsystem 17aa:230e.
# Enables the upstream headset button fixup. Hardware behavior needs testing.
# Source: Linux sound/hda/codecs/realtek/alc269.c
# Install into /etc/modprobe.d/ with root ownership, then reboot.
# Roll back by removing /etc/modprobe.d/99-headset-buttons.conf and rebooting.
options snd-hda-intel model=alc-headset-jack
